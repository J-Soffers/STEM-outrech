<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Links</title>

<style>
    body {
        margin: 0;
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        background: linear-gradient(180deg, #0f172a, #020617);
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        padding: 60px 20px;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 720px;
    }

    h1 {
        margin: 0 0 10px 0;
        font-weight: 500;
        letter-spacing: 0.5px;
        text-align: center;
    }

    .intro {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 34px 0;
        text-align: center;
    }

    h2 {
        margin: 32px 0 6px 0;
        font-size: 15px;
        font-weight: 600;
        color: #94a3b8;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .section-desc {
        color: #7c8aa0;
        font-size: 13px;
        line-height: 1.6;
        margin: 0 0 10px 0;
        max-width: 65ch;
    }

    .subsection {
        color: #5f6f86;
        font-size: 11.5px;
        line-height: 1.65;
        margin: 0 0 10px 0;
        max-width: 65ch;
        padding-left: 14px;
    }

    ul {
        list-style: none;
        padding-left: 14px; 
        margin: 0 0 18px 0;
    }

    li {
        margin: 7px 0;
    }

    a {
        color: #cbd5e1;
        text-decoration: none;
        font-size: 16px;
        transition: color 0.2s ease;
    }

    a:hover {
        color: #ffffff;
    }
</style>
</head>
